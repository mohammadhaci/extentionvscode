# Agent guardrails: runs Django Agent Studio's checks on every pull request and
# on pushes to the default branch.
#
#   Change report       one-page review of the PR at the top of the job summary (never fails)
#   Migrations Guard    unsafe, edited or conflicting migrations
#   App structure       apps that drift from the reference app (when one is set)
#   Agent instructions  stale CLAUDE.md / AGENTS.md / copilot-instructions.md (when rules exist)
#
# Generated by Django Agent Studio. Update it from VS Code ("Agent Studio:
# Set Up Project") or with `node .agent-studio/tool/cli.js context install-ci --force`.

name: Agent guardrails

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  guardrails:
    name: Agent guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history, needed to compare with the base branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect Agent Studio
        id: studio
        run: |
          if [ -f .agent-studio/tool/cli.js ]; then echo "installed=true" >> "$GITHUB_OUTPUT"; else echo "installed=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f .agent-studio/scaffold.json ]; then echo "scaffold=true" >> "$GITHUB_OUTPUT"; else echo "scaffold=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f .agent-studio/rules.md ]; then echo "rules=true" >> "$GITHUB_OUTPUT"; else echo "rules=false" >> "$GITHUB_OUTPUT"; fi
          if [ ! -f .agent-studio/tool/cli.js ]; then
            echo "::warning::Django Agent Studio is not installed (.agent-studio/tool/). Run \"Agent Studio: Set Up Project\" in VS Code and commit .agent-studio/."
          fi

      # Review summary first in the job summary; the checks below report their own results.
      - name: Change report
        if: ${{ !cancelled() && steps.studio.outputs.installed == 'true' && github.base_ref != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! node .agent-studio/tool/cli.js report --base "origin/$BASE_REF" --no-tools >> "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Change report could not be generated."
          fi

      # Each check runs even if an earlier one failed, so one run shows every problem.
      - name: Migrations Guard
        if: ${{ !cancelled() && steps.studio.outputs.installed == 'true' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Pull requests: everything the branch adds. Pushes: graph-wide conflicts after merges.
          args=(guard check)
          if [ -n "$BASE_REF" ]; then args+=(--base "origin/$BASE_REF"); fi
          set +e
          out="$(node .agent-studio/tool/cli.js "${args[@]}" 2>&1)"; code=$?
          set -e
          echo "$out"
          # shellcheck disable=SC2016  # the backticks are a literal Markdown code fence
          printf '### Migrations Guard\n```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: App structure vs reference app
        if: ${{ !cancelled() && steps.studio.outputs.installed == 'true' && steps.studio.outputs.scaffold == 'true' }}
        run: |
          set +e
          out="$(node .agent-studio/tool/cli.js scaffold check 2>&1)"; code=$?
          set -e
          echo "$out"
          printf '### App structure\n%s\n\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Agent instructions up to date
        if: ${{ !cancelled() && steps.studio.outputs.installed == 'true' && steps.studio.outputs.rules == 'true' }}
        run: |
          set +e
          out="$(node .agent-studio/tool/cli.js context check 2>&1)"; code=$?
          set -e
          echo "$out"
          # shellcheck disable=SC2016  # the backticks are a literal Markdown code fence
          printf '### Agent instructions\n```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ]; then
            echo "::error::Agent instructions are stale. Run: node .agent-studio/tool/cli.js context sync, then commit CLAUDE.md, AGENTS.md and .github/copilot-instructions.md."
          fi
          exit "$code"

      # Optional: prove the migrations match the models. This needs your
      # project's dependencies and settings, so adapt it before enabling.
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      # - name: No missing migrations
      #   if: ${{ !cancelled() }}
      #   env:
      #     DJANGO_SETTINGS_MODULE: config.settings   # TODO: your settings module
      #   run: |
      #     pip install -r requirements.txt           # TODO: your requirements file
      #     python manage.py makemigrations --check --dry-run
