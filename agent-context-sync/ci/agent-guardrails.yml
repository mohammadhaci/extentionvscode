# Agent guardrails: runs the project checks of the agent tools that are
# installed in this repository, on every pull request and on pushes to the
# default branch. Tools that are not installed are skipped.
#
#   Migrations Guard     .migrations-guard/tool/cli.js   unsafe or edited migrations
#   Django App Scaffolder .django-scaffold/tool/cli.js   apps that drift from the reference app
#   Agent Context Sync   .agent-context/tool/cli.js      stale CLAUDE.md / AGENTS.md / copilot-instructions.md
#   Agent Change Report  .agent-change-report/tool/cli.js  posts a review summary of the PR (never fails)
#
# Generated by Agent Context Sync. Re-install it from VS Code
# ("Agent Context: Install CI Guardrails Workflow") or with
# `node .agent-context/tool/cli.js install-ci --force` to update it.

name: Agent guardrails

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  guardrails:
    name: Agent guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history, needed to compare with the base branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect installed tools
        id: tools
        run: |
          found=0
          for t in migrations-guard:.migrations-guard/tool/cli.js scaffold:.django-scaffold/tool/cli.js context:.agent-context/tool/cli.js report:.agent-change-report/tool/cli.js; do
            key="${t%%:*}"; file="${t#*:}"
            if [ -f "$file" ]; then echo "$key=true" >> "$GITHUB_OUTPUT"; found=1; else echo "$key=false" >> "$GITHUB_OUTPUT"; fi
          done
          if [ -f .django-scaffold.json ]; then echo "scaffold_config=true" >> "$GITHUB_OUTPUT"; else echo "scaffold_config=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$found" = 0 ]; then
            echo "::warning::No agent tools found (.migrations-guard/, .django-scaffold/, .agent-context/). Install them from VS Code and commit them."
          fi

      # Review summary first in the job summary; the checks below report their own results.
      - name: Change report
        if: ${{ !cancelled() && steps.tools.outputs.report == 'true' && github.base_ref != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! node .agent-change-report/tool/cli.js report --base "origin/$BASE_REF" --no-tools >> "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Change report could not be generated."
          fi

      # Each check runs even if an earlier one failed, so one run shows every problem.
      - name: Migrations Guard
        if: ${{ !cancelled() && steps.tools.outputs.migrations-guard == 'true' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Pull requests: everything the branch adds. Pushes: graph-wide conflicts after merges.
          args=(check)
          if [ -n "$BASE_REF" ]; then args+=(--base "origin/$BASE_REF"); fi
          set +e
          out="$(node .migrations-guard/tool/cli.js "${args[@]}" 2>&1)"; code=$?
          set -e
          echo "$out"
          # shellcheck disable=SC2016  # the backticks are a literal Markdown code fence
          printf '### Migrations Guard\n```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: App structure vs reference app
        if: ${{ !cancelled() && steps.tools.outputs.scaffold == 'true' && steps.tools.outputs.scaffold_config == 'true' }}
        run: |
          set +e
          out="$(node .django-scaffold/tool/cli.js check 2>&1)"; code=$?
          set -e
          echo "$out"
          printf '### App structure\n%s\n\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Agent instructions up to date
        if: ${{ !cancelled() && steps.tools.outputs.context == 'true' }}
        run: |
          set +e
          out="$(node .agent-context/tool/cli.js check 2>&1)"; code=$?
          set -e
          echo "$out"
          # shellcheck disable=SC2016  # the backticks are a literal Markdown code fence
          printf '### Agent instructions\n```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ]; then
            echo "::error::Agent instructions are stale. Run: node .agent-context/tool/cli.js sync, then commit CLAUDE.md, AGENTS.md and .github/copilot-instructions.md."
          fi
          exit "$code"

      # Optional: prove the migrations match the models. This needs your
      # project's dependencies and settings, so adapt it before enabling.
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      # - name: No missing migrations
      #   if: ${{ !cancelled() }}
      #   env:
      #     DJANGO_SETTINGS_MODULE: config.settings   # TODO: your settings module
      #   run: |
      #     pip install -r requirements.txt           # TODO: your requirements file
      #     python manage.py makemigrations --check --dry-run
